<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aesthetics360</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shepherd.js@10.0.1/dist/css/shepherd.css"/>
    <script src="https://cdn.jsdelivr.net/npm/shepherd.js@10.0.1/dist/js/shepherd.min.js"></script>
    <style>
      :root {
        --background: 216 25% 97%;
        --foreground: 212 28% 24%;
        --card: 0 0% 100%;
        --card-foreground: 212 28% 24%;
        --popover: 0 0% 100%;
        --popover-foreground: 212 28% 24%;
        --primary: 212 33% 49%;
        --primary-foreground: 0 0% 100%;
        --secondary: 220 27% 94%;
        --secondary-foreground: 212 28% 24%;
        --muted: 220 27% 94%;
        --muted-foreground: 211 35% 60%;
        --accent: 220 27% 94%;
        --accent-foreground: 212 28% 24%;
        --destructive: 0 84% 60%;
        --destructive-foreground: 0 0% 100%;
        --success: 142 71% 45%;
        --warning: 48 96% 50%;
        --border: 217 33% 86%;
        --input: 217 33% 86%;
        --ring: 212 33% 49%;
        --radius: 0.75rem; /* 12px */
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: hsl(var(--background));
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Custom Soft Scrollbar */
      /* For Webkit browsers (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: hsl(var(--border));
        border-radius: 10px;
        border: 2px solid hsl(var(--background));
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: hsl(var(--muted-foreground));
      }

      /* For Firefox */
      html {
        scrollbar-width: thin;
        scrollbar-color: hsl(var(--border)) transparent;
      }

      .recharts-default-tooltip {
        border-radius: 0.75rem !important;
        border: 1px solid hsl(var(--border)) !important;
        background-color: hsl(var(--card)) !important;
        box-shadow: none !important;
        color: hsl(var(--card-foreground)) !important;
      }

      /* Shepherd tour styles */
      .shepherd-element {
          background: hsl(var(--card));
          border-radius: var(--radius);
          border: 1px solid hsl(var(--border));
          box-shadow: none;
          max-width: 400px;
      }
      .shepherd-header {
          background: hsl(var(--secondary));
          padding: 1rem 1.5rem;
          border-bottom: 1px solid hsl(var(--border));
      }
      .shepherd-title {
          color: hsl(var(--card-foreground));
          font-weight: 600;
          font-size: 1rem;
      }
      .shepherd-text {
          color: hsl(var(--muted-foreground));
          padding: 0.5rem 1.5rem 1.5rem;
          font-size: 0.875rem;
          line-height: 1.5;
      }
      .shepherd-footer {
        padding: 0 1.5rem 1rem;
      }
      .shepherd-button {
          padding: 0.5rem 1rem;
          border-radius: calc(var(--radius) - 2px);
          font-weight: 500;
          cursor: pointer;
          transition: background-color 0.2s;
          margin-right: 0.5rem;
      }
      .shepherd-button-secondary {
          background-color: hsl(var(--secondary));
          color: hsl(var(--secondary-foreground));
      }
      .shepherd-button-secondary:hover {
          background-color: hsl(var(--muted));
      }
      .shepherd-button.shepherd-button-primary {
          background-color: hsl(var(--primary));
          color: hsl(var(--primary-foreground));
      }
      .shepherd-button.shepherd-button-primary:hover {
          opacity: 0.9;
      }
      .shepherd-arrow::before {
          background-color: hsl(var(--card));
      }
      .shepherd-cancel-icon {
          color: hsl(var(--muted-foreground));
      }
      .shepherd-cancel-icon:hover {
          color: hsl(var(--foreground));
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          container: {
            center: true,
            padding: "2rem",
            screens: { "2xl": "1400px" },
          },
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            },
            colors: {
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              primary: {
                DEFAULT: 'hsl(var(--primary))',
                foreground: 'hsl(var(--primary-foreground))',
              },
              secondary: {
                DEFAULT: 'hsl(var(--secondary))',
                foreground: 'hsl(var(--secondary-foreground))',
              },
              destructive: {
                DEFAULT: 'hsl(var(--destructive))',
                foreground: 'hsl(var(--destructive-foreground))',
              },
              success: 'hsl(var(--success))',
              warning: 'hsl(var(--warning))',
              muted: {
                DEFAULT: 'hsl(var(--muted))',
                foreground: 'hsl(var(--muted-foreground))',
              },
              accent: {
                DEFAULT: 'hsl(var(--accent))',
                foreground: 'hsl(var(--accent-foreground))',
              },
              popover: {
                DEFAULT: 'hsl(var(--popover))',
                foreground: 'hsl(var(--popover-foreground))',
              },
              card: {
                DEFAULT: 'hsl(var(--card))',
                foreground: 'hsl(var(--card-foreground))',
              },
            },
            borderRadius: {
              xl: 'calc(var(--radius) + 4px)',
              lg: 'var(--radius)',
              md: 'calc(var(--radius) - 4px)',
              sm: 'calc(var(--radius) - 8px)',
            },
            keyframes: {
              'accordion-down': { from: { height: '0' }, to: { height: 'var(--radix-accordion-content-height)' } },
              'accordion-up': { from: { height: 'var(--radix-accordion-content-height)' }, to: { height: '0' } },
            },
            animation: {
              'accordion-down': 'accordion-down 0.2s ease-out',
              'accordion-up': 'accordion-up 0.2s ease-out',
            },
            boxShadow: {
                DEFAULT: '0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1)',
                md: '0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1)',
                lg: '0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1)',
            }
          }
        }
      }
    </script>
    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1",
    "recharts": "https://aistudiocdn.com/recharts@^3.2.1",
    "clsx": "https://aistudiocdn.com/clsx@^2.1.1",
    "tailwind-merge": "https://aistudiocdn.com/tailwind-merge@^2.4.0",
    "class-variance-authority": "https://aistudiocdn.com/class-variance-authority@^0.7.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.412.0",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.21.0"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
